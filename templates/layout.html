<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}SmartPark{% endblock %}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link href="/static/css/styles.css" rel="stylesheet" />
    {% block head %}{% endblock %}
  </head>
  <body>
    <nav class="navbar navbar-expand-lg bg-white shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="/">
          <i class="fas fa-parking text-primary"></i>
          SmartPark
          <small class="text-muted" style="font-weight: 400">2026</small>
        </a>
        <div class="d-flex align-items-center gap-3">
          {% if current_user.is_authenticated %}
          <span class="text-muted-2"
            >Signed in as <strong>{{ current_user.username }}</strong></span
          >
          <a
            class="btn btn-outline-danger btn-sm"
            href="{{ url_for('auth.logout') }}"
            >Logout</a
          >
          {% else %}
          <a
            class="btn btn-outline-secondary btn-sm"
            href="{{ url_for('auth.login') }}"
            >Login</a
          >
          {% endif %}
        </div>
      </div>
    </nav>

    <main class="app-container container">
      {% block content %}{% endblock %}
    </main>

    <footer class="text-center py-4">
      <p class="footer-muted">Built with Flask · SmartPark System © 2026</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
