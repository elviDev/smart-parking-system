services:
  - type: web
    name: smart-parking-system
    runtime: python
    repo: https://github.com/YOUR_USERNAME/smart-parking-system
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: smart-parking-db
          property: connectionString
      - key: CAMERA_SOURCE
        value: 0
    buildCommand: |
      pip install -r requirements.txt
      python create_admin.py
    startCommand: |
      gunicorn run:app
    healthCheckPath: /test

databases:
  - name: smart-parking-db
    databaseName: parking
    user: parking_user
    plan: free
